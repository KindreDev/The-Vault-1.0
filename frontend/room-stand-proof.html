<!doctype html>
<meta charset="utf-8">
<title>Room stand placement proof</title>
<style>html,body{margin:0;height:100%;background:#101018;color:#fff;font:16px system-ui}#proof{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100%;gap:8px}section{position:relative;min-width:0;min-height:0}canvas{width:100%;height:100%;display:block}label{position:absolute;top:12px;left:14px;padding:8px 12px;border-radius:8px;background:#161622dd}</style>
<div id="proof"><section><label>Graded stand · FRONT (-Z)</label></section><section><label>Graded stand · +X side</label></section><section><label>Single stand · FRONT (+Z)</label></section><section><label>Single stand · +X side · groove</label></section></div>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { displaySlotsFor, standMeshScale } from './src/components/tcg-room/roomLayout.js'
const card = { w:.0756, h:.1056 }
const wide = displaySlotsFor('graded_card_stand_black')
const single = displaySlotsFor('card_display_stand_white')
const loader = new GLTFLoader()
function scene(host, cameraPosition, standPath, slots, scale=1, targetY=.18) {
  const s = new THREE.Scene(); s.background = new THREE.Color('#151520')
  const c = new THREE.PerspectiveCamera(42, host.clientWidth/host.clientHeight,.01,10); c.position.set(...cameraPosition); c.lookAt(0,targetY,0)
  const r = new THREE.WebGLRenderer({antialias:true}); r.setPixelRatio(devicePixelRatio); host.append(r.domElement)
  s.add(new THREE.HemisphereLight('#fff8ee','#667080',2.2), new THREE.DirectionalLight('#fff',2))
  loader.load(standPath,g=>{const stand=g.scene; stand.scale.setScalar(scale); s.add(stand); for(const slot of slots){const q=new THREE.Mesh(new THREE.BoxGeometry(card.w,card.h,.004),new THREE.MeshStandardMaterial({color:'#54b9ff',emissive:'#172a66',roughness:.42})); q.position.set(slot.x,slot.y,slot.z); q.scale.setScalar(slot.scale||1); const host=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,slot.yaw||0,0)); const local=new THREE.Quaternion().setFromEuler(new THREE.Euler(slot.tilt,0,0)); q.quaternion.copy(host.multiply(local)); s.add(q)}})
  function frame(){r.setSize(host.clientWidth,host.clientHeight,false);r.render(s,c);requestAnimationFrame(frame)} frame()
}
const hosts=[...document.querySelectorAll('section')]
scene(hosts[0],[0,.19,-.82],'/tcg-room/furniture/graded_card_stand_black.glb',wide)
scene(hosts[1],[.55,.19,-.45],'/tcg-room/furniture/graded_card_stand_black.glb',wide)
scene(hosts[2],[0,.08,.30],'/tcg-room/furniture/card_display_stand_white.glb',single,standMeshScale('card_display_stand_white'),.05)
scene(hosts[3],[.28,.08,.20],'/tcg-room/furniture/card_display_stand_white.glb',single,standMeshScale('card_display_stand_white'),.05)
</script>
